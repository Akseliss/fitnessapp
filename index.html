<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f5f5f4;
    --color-background-tertiary: #eeede8;
    --color-text-primary: #1a1a18;
    --color-text-secondary: #5f5e5a;
    --color-text-tertiary: #888780;
    --color-border-tertiary: rgba(0,0,0,0.12);
    --color-border-secondary: rgba(0,0,0,0.22);
    --border-radius-md: 8px;
    --border-radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --orange: #D85A30;
    --orange-light: #FAECE7;
    --orange-dark: #993C1D;
    --green: #639922;
    --green-light: #EAF3DE;
    --teal: #1D9E75;
    --teal-light: #E1F5EE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-background-primary: #1e1e1c;
      --color-background-secondary: #2a2a28;
      --color-background-tertiary: #131312;
      --color-text-primary: #f0efe8;
      --color-text-secondary: #b4b2a9;
      --color-text-tertiary: #888780;
      --color-border-tertiary: rgba(255,255,255,0.1);
      --color-border-secondary: rgba(255,255,255,0.2);
      --orange-light: #3a1a0e;
      --orange-dark: #f0a080;
      --teal-light: #0a2a20;
      --green-light: #1a2e08;
    }
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-background-tertiary);
    color: var(--color-text-primary);
    min-height: 100vh;
  }
  .app { max-width: 480px; margin: 0 auto; background: var(--color-background-tertiary); min-height: 100vh; position: relative; }
  .tab-bar {
    display: flex;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
    position: sticky; top: 0; z-index: 10;
  }
  .tab-btn {
    flex: 1; padding: 10px 4px 8px; font-size: 11px; font-weight: 500;
    border: none; background: none; cursor: pointer;
    color: var(--color-text-secondary);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); }
  .tab-btn i { display: block; font-size: 22px; margin-bottom: 2px; }
  .screen { display: none; padding: 16px 16px 100px; }
  .screen.active { display: block; }
  .day-selector {
    display: flex; gap: 6px; overflow-x: auto;
    padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none;
  }
  .day-selector::-webkit-scrollbar { display: none; }
  .day-chip {
    flex-shrink: 0; padding: 7px 14px; border-radius: 20px;
    border: 0.5px solid var(--color-border-tertiary);
    font-size: 13px; cursor: pointer;
    background: var(--color-background-primary);
    color: var(--color-text-secondary);
    font-weight: 400; transition: all 0.15s;
    font-family: var(--font-sans);
  }
  .day-chip.active { background: var(--orange); border-color: var(--orange); color: white; font-weight: 500; }
  .section-header {
    font-size: 10px; font-weight: 600; color: var(--color-text-tertiary);
    letter-spacing: 0.6px; text-transform: uppercase; margin: 20px 0 8px;
  }
  .exercise-card {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 12px 14px; margin-bottom: 8px;
  }
  .ex-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
  .ex-name { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
  .ex-target { font-size: 11px; color: var(--color-text-tertiary); text-align: right; flex-shrink: 0; max-width: 120px; line-height: 1.4; }
  .ex-prev {
    font-size: 11px; color: var(--color-text-secondary);
    margin-bottom: 8px; padding: 5px 8px;
    background: var(--color-background-secondary);
    border-radius: 6px; line-height: 1.5;
  }
  .ex-prev strong { color: var(--teal); }
  .sets-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .set-label { font-size: 12px; color: var(--color-text-tertiary); width: 28px; text-align: center; }
  .set-input {
    flex: 1; height: 36px; border-radius: 8px;
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    text-align: center; font-size: 14px;
    color: var(--color-text-primary);
    outline: none; font-family: var(--font-sans);
    -webkit-appearance: none;
  }
  .set-input:focus { border-color: var(--orange); }
  .set-x { font-size: 12px; color: var(--color-text-tertiary); }
  .set-check {
    width: 32px; height: 32px; border-radius: 50%;
    border: 0.5px solid var(--color-border-tertiary);
    background: none; cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
    color: var(--color-text-tertiary);
  }
  .set-check.done { background: var(--green); border-color: var(--green); color: white; }
  .amrap-card {
    background: var(--orange-light); border: 0.5px solid var(--orange);
    border-radius: var(--border-radius-lg); padding: 12px 14px; margin-bottom: 8px;
  }
  .amrap-label { font-size: 11px; font-weight: 600; color: var(--orange-dark); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
  .amrap-input-row { display: flex; align-items: center; gap: 10px; }
  .amrap-big-input {
    width: 72px; height: 48px; border-radius: 10px;
    border: 1.5px solid var(--orange); background: white;
    text-align: center; font-size: 24px; font-weight: 500;
    color: var(--orange-dark); outline: none;
    font-family: var(--font-sans);
    -webkit-appearance: none;
  }
  .amrap-unit { font-size: 14px; color: var(--orange-dark); }
  .amrap-prev { font-size: 12px; color: var(--orange-dark); margin-top: 6px; }
  .save-btn {
    width: 100%; padding: 15px; background: var(--orange);
    color: white; border: none; border-radius: var(--border-radius-lg);
    font-size: 16px; font-weight: 500; cursor: pointer;
    margin-top: 16px; font-family: var(--font-sans);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .save-btn:active { opacity: 0.85; transform: scale(0.99); }
  .meal-card {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    margin-bottom: 10px; overflow: hidden;
  }
  .meal-header {
    padding: 12px 14px;
    background: var(--color-background-secondary);
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
  }
  .meal-title { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
  .meal-kcal { font-size: 12px; color: var(--color-text-secondary); }
  .meal-body { padding: 10px 14px; display: none; }
  .meal-body.open { display: block; }
  .meal-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .meal-food { flex: 1; font-size: 13px; color: var(--color-text-primary); line-height: 1.3; }
  .meal-planned { font-size: 12px; color: var(--color-text-tertiary); width: 44px; text-align: center; }
  .meal-actual-input {
    width: 56px; height: 32px; border-radius: 6px;
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    text-align: center; font-size: 13px;
    color: var(--color-text-primary); outline: none;
    font-family: var(--font-sans);
    -webkit-appearance: none;
  }
  .meal-actual-input:focus { border-color: var(--teal); }
  .col-label { font-size: 10px; color: var(--color-text-tertiary); text-align: center; }
  .summary-card {
    background: var(--teal-light); border: 0.5px solid var(--teal);
    border-radius: var(--border-radius-lg); padding: 14px; margin-top: 16px;
  }
  .summary-title { font-size: 11px; font-weight: 600; color: var(--teal); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 12px; }
  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .summary-item { text-align: center; background: var(--color-background-primary); border-radius: 8px; padding: 10px 6px; }
  .summary-num { font-size: 22px; font-weight: 500; }
  .summary-lbl { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
  .summary-num.ok { color: var(--teal); }
  .summary-num.over { color: var(--orange); }
  .summary-num.under { color: var(--color-text-tertiary); }
  .history-card {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 12px 14px; margin-bottom: 10px;
  }
  .history-date { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 2px; }
  .history-day-label { font-size: 11px; color: var(--orange); margin-bottom: 8px; font-weight: 500; }
  .history-exercises { font-size: 12px; color: var(--color-text-secondary); line-height: 1.9; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--color-text-tertiary); }
  .empty-state i { font-size: 48px; display: block; margin-bottom: 12px; }
  .note-textarea {
    width: 100%; height: 68px; border-radius: 8px;
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    padding: 8px 10px; font-size: 13px;
    color: var(--color-text-primary);
    font-family: var(--font-sans); outline: none; resize: none; margin-top: 6px;
  }
  .tag { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; margin-right: 4px; }
  .tag-strength { background: #E6F1FB; color: #0C447C; }
  .tag-cardio { background: #FAEEDA; color: #633806; }
  .tag-skill { background: #EEEDFE; color: #3C3489; }
  .tag-firefighter { background: var(--orange-light); color: var(--orange-dark); }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
</style>
</head>

function showScreen(name) {

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'history') renderHistory();
}

function buildDaySelector(containerId, activeDay, onClick) {
  const c = document.getElementById(containerId);
  c.innerHTML = '';
  DAYS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-chip' + (d === activeDay ? ' active' : '');
    btn.textContent = d;
    btn.onclick = () => onClick(d);
    c.appendChild(btn);
  });
}

function getPrevLog(day, exName) {
  const keys = Object.keys(history).filter(k => k.endsWith('_' + day) && !k.startsWith('meal_')).sort().reverse();
  for (const k of keys) {
    const log = history[k];
    if (log.exercises && log.exercises[exName]) return log.exercises[exName];
  }
  return null;
}

function sanitize(s) { return s.replace(/[^a-zA-Z0-9]/g,'_'); }

function toggleCheck(btn) { btn.classList.toggle('done'); }

function renderWorkout(day) {
  workoutDay = day;
  buildDaySelector('workout-day-selector', day, renderWorkout);
  const cont = document.getElementById('workout-content');
  const wk = WORKOUTS[day];

  if (!wk || wk.sections.length === 0) {
    cont.innerHTML = '<div class="empty-state"><i class="ti ti-zzz"></i><p style="font-size:17px;font-weight:500;color:var(--color-text-primary)">Rest day</p><p style="font-size:14px;margin-top:8px">Non-negotiable. Recovery is training.</p></div>';
    return;
  }

  const tagMap = { strength: ['strength','tag-strength'], cardio: ['cardio','tag-cardio'], skill: ['skill','tag-skill'], firefighter: ['firefighter test','tag-firefighter'] };
  let html = `<p style="font-size:18px;font-weight:500;color:var(--color-text-primary);margin-bottom:8px">${wk.label}</p>`;
  html += wk.tags.map(t => `<span class="tag ${tagMap[t][1]}">${tagMap[t][0]}</span>`).join('');

  wk.sections.forEach(sec => {
    html += `<div class="section-header">${sec.name}</div>`;
    sec.exercises.forEach(ex => {
      const prev = getPrevLog(day, ex.name);
      html += buildExCard(ex, prev);
    });
  });

  const today = new Date().toISOString().split('T')[0];
  const savedNote = (history[today + '_' + day] || {}).note || '';
  html += `<div class="section-header">Notes</div>`;
  html += `<textarea class="note-textarea" id="workout-note" placeholder="How did it feel? Any PRs or issues...">${savedNote}</textarea>`;
  html += `<button class="save-btn" onclick="saveWorkout('${day}')"><i class="ti ti-device-floppy"></i> Save workout</button>`;
  cont.innerHTML = html;
}

function buildExCard(ex, prev) {
  if (ex.type === 'amrap') {
    return `<div class="amrap-card">
      <div class="amrap-label">🔥 ${ex.name}</div>
      <div style="font-size:12px;color:var(--orange-dark);margin-bottom:8px">${ex.target}</div>
      <div class="amrap-input-row">
        <input class="amrap-big-input" type="number" id="ex_${sanitize(ex.name)}" placeholder="0" min="0" inputmode="numeric">
        <span class="amrap-unit">${ex.unit}</span>
      </div>
      ${prev ? `<div class="amrap-prev">Last time: <strong>${prev.amrap} ${ex.unit}</strong></div>` : ''}
    </div>`;
  }

  let rows = '';
  for (let i = 1; i <= ex.sets; i++) {
    const pv = prev && prev.sets && prev.sets[i-1];
    if (ex.type === 'intervals') {
      rows += `<div class="sets-row">
        <span class="set-label">${i}</span>
        <input class="set-input" type="text" id="ex_${sanitize(ex.name)}_${i}_time" placeholder="mm:ss">
        <span class="set-x">time</span>
        <button class="set-check" onclick="toggleCheck(this)" aria-label="Mark done">✓</button>
      </div>`;
    } else if (ex.type === 'weighted') {
      rows += `<div class="sets-row">
        <span class="set-label">${i}</span>
        <input class="set-input" type="number" id="ex_${sanitize(ex.name)}_${i}_kg" placeholder="${pv && pv.kg ? pv.kg : 'kg'}" style="max-width:60px" inputmode="decimal">
        <span class="set-x">kg×</span>
        <input class="set-input" type="number" id="ex_${sanitize(ex.name)}_${i}_reps" placeholder="${pv && pv.reps ? pv.reps : 'reps'}" inputmode="numeric">
        <button class="set-check${pv && (pv.kg || pv.reps) ? ' done' : ''}" onclick="toggleCheck(this)" aria-label="Mark done">✓</button>
      </div>`;
    } else if (ex.type === 'time') {
      rows += `<div class="sets-row">
        <span class="set-label">${i}</span>
        <input class="set-input" type="text" id="ex_${sanitize(ex.name)}_${i}_time" placeholder="${pv && pv.time ? pv.time : 'sec / notes'}">
        <button class="set-check" onclick="toggleCheck(this)" aria-label="Mark done">✓</button>
      </div>`;
    } else {
      rows += `<div class="sets-row">
        <span class="set-label">${i}</span>
        <input class="set-input" type="number" id="ex_${sanitize(ex.name)}_${i}_reps" placeholder="${pv && pv.reps ? pv.reps : 'reps'}" inputmode="numeric">
        <button class="set-check" onclick="toggleCheck(this)" aria-label="Mark done">✓</button>
      </div>`;
    }
  }

  return `<div class="exercise-card">
    <div class="ex-header"><span class="ex-name">${ex.name}</span><span class="ex-target">${ex.target}</span></div>
    ${prev ? `<div class="ex-prev">Last: <strong>${prev.summary || (prev.amrap + ' ' + (prev.unit||''))}</strong></div>` : ''}
    ${rows}
  </div>`;
}

function saveWorkout(day) {
  const today = new Date().toISOString().split('T')[0];
  const key = today + '_' + day;
  const wk = WORKOUTS[day];
  const exercises = {};

  wk.sections.forEach(sec => {
    sec.exercises.forEach(ex => {
      const id = sanitize(ex.name);
      if (ex.type === 'amrap') {
        const el = document.getElementById('ex_' + id);
        exercises[ex.name] = { amrap: el ? el.value : '', unit: ex.unit };
      } else if (ex.type === 'intervals') {
        const sets = [];
        for (let i = 1; i <= ex.sets; i++) {
          const t = document.getElementById(`ex_${id}_${i}_time`);
          sets.push({ time: t ? t.value : '' });
        }
        exercises[ex.name] = { sets, summary: sets.filter(s=>s.time).map(s=>s.time).join(', ') };
      } else if (ex.type === 'weighted') {
        const sets = [];
        for (let i = 1; i <= ex.sets; i++) {
          const kg = document.getElementById(`ex_${id}_${i}_kg`);
          const reps = document.getElementById(`ex_${id}_${i}_reps`);
          sets.push({ kg: kg ? kg.value : '', reps: reps ? reps.value : '' });
        }
        exercises[ex.name] = { sets, summary: sets.filter(s=>s.kg||s.reps).map(s=>`${s.kg||'?'}kg×${s.reps||'?'}`).join(', ') };
      } else {
        const sets = [];
        for (let i = 1; i <= ex.sets; i++) {
          const reps = document.getElementById(`ex_${id}_${i}_reps`);
          const time = document.getElementById(`ex_${id}_${i}_time`);
          sets.push({ reps: reps ? reps.value : '', time: time ? time.value : '' });
        }
        exercises[ex.name] = { sets, summary: sets.filter(s=>s.reps||s.time).map(s=>s.reps||s.time).filter(Boolean).join(', ') };
      }
    });
  });

  const note = document.getElementById('workout-note');
  history[key] = { day, label: wk.label, exercises, note: note ? note.value : '' };
  saveHistory();

  const btn = document.querySelector('#screen-workout .save-btn');
  if (btn) {
    btn.innerHTML = '<i class="ti ti-check"></i> Saved!';
    btn.style.background = '#1D9E75';
    setTimeout(() => { btn.innerHTML = '<i class="ti ti-device-floppy"></i> Save workout'; btn.style.background = ''; }, 1800);
  }
}

function renderMeals(day) {
  mealDay = day;
  buildDaySelector('meal-day-selector', day, renderMeals);
  const cont = document.getElementById('meal-content');
  const plan = MEALS[day];

  let html = `<p style="font-size:18px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px">${plan.label}</p>`;
  html += `<p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:14px">Target: ${plan.kcal} kcal · ${plan.protein}g protein · ${plan.carbs}g carbs · ${plan.fat}g fat</p>`;

  plan.meals.forEach((meal, mi) => {
    html += `<div class="meal-card">
      <div class="meal-header" onclick="toggleMeal(${mi})">
        <span class="meal-title">${meal.name}</span>
        <span class="meal-kcal">${meal.planned_kcal} kcal</span>
      </div>
      <div class="meal-body" id="meal-body-${mi}">
        <div style="display:grid;grid-template-columns:1fr 44px 56px;gap:8px;padding-bottom:6px">
          <span class="col-label" style="text-align:left">Food</span>
          <span class="col-label">Plan</span>
          <span class="col-label">Actual</span>
        </div>`;
    meal.items.forEach((item, ii) => {
      const qty = item.match(/^([\d]+g?)\s/) ? item.match(/^([\d]+g?)\s/)[1] : '1×';
      html += `<div class="meal-row">
        <span class="meal-food">${item}</span>
        <span class="meal-planned">${qty}</span>
        <input class="meal-actual-input" type="text" placeholder="${qty}" id="meal_${mi}_${ii}">
      </div>`;
    });
    html += `<div style="border-top:0.5px solid var(--color-border-tertiary);margin-top:8px;padding-top:8px;display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;color:var(--color-text-secondary);flex:1">Actual kcal</span>
          <input class="meal-actual-input" type="number" placeholder="${meal.planned_kcal}" id="meal_kcal_${mi}" style="width:72px" inputmode="numeric">
          <span style="font-size:12px;color:var(--color-text-tertiary)">kcal</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;color:var(--color-text-secondary);flex:1">Actual protein</span>
          <input class="meal-actual-input" type="number" placeholder="${meal.planned_protein}" id="meal_prot_${mi}" style="width:72px" inputmode="numeric">
          <span style="font-size:12px;color:var(--color-text-tertiary)">g</span>
        </div>
      </div>
    </div></div>`;
  });

  html += `<button class="save-btn" style="background:var(--teal)" onclick="saveMeals('${day}')"><i class="ti ti-device-floppy"></i> Save & see summary</button>`;
  html += `<div id="meal-summary" style="margin-top:12px"></div>`;
  cont.innerHTML = html;
  loadMealData(day);
}

function toggleMeal(idx) {
  document.getElementById('meal-body-' + idx).classList.toggle('open');
}

function loadMealData(day) {
  const today = new Date().toISOString().split('T')[0];
  const saved = history['meal_' + today + '_' + day];
  if (!saved) return;
  MEALS[day].meals.forEach((meal, mi) => {
    meal.items.forEach((_, ii) => {
      const inp = document.getElementById(`meal_${mi}_${ii}`);
      if (inp && saved.items && saved.items[mi]) inp.value = saved.items[mi][ii] || '';
    });
    const k = document.getElementById(`meal_kcal_${mi}`);
    const p = document.getElementById(`meal_prot_${mi}`);
    if (k && saved.kcals) k.value = saved.kcals[mi] || '';
    if (p && saved.prots) p.value = saved.prots[mi] || '';
  });
}

function saveMeals(day) {
  const today = new Date().toISOString().split('T')[0];
  const plan = MEALS[day];
  const kcals = [], prots = [], items = [];
  let totalKcal = 0, totalProt = 0;

  plan.meals.forEach((meal, mi) => {
    const kEl = document.getElementById(`meal_kcal_${mi}`);
    const pEl = document.getElementById(`meal_prot_${mi}`);
    const k = parseFloat(kEl && kEl.value ? kEl.value : meal.planned_kcal) || meal.planned_kcal;
    const p = parseFloat(pEl && pEl.value ? pEl.value : meal.planned_protein) || meal.planned_protein;
    kcals.push(k); prots.push(p);
    totalKcal += k; totalProt += p;
    const mItems = meal.items.map((_, ii) => { const el = document.getElementById(`meal_${mi}_${ii}`); return el ? el.value : ''; });
    items.push(mItems);
  });

  history['meal_' + today + '_' + day] = { day, kcals, prots, items };
  saveHistory();

  const kcalDiff = Math.round(totalKcal - plan.kcal);
  const protDiff = Math.round(totalProt - plan.protein);
  const kcalClass = Math.abs(kcalDiff) < 100 ? 'ok' : (kcalDiff > 0 ? 'over' : 'under');
  const protClass = Math.abs(protDiff) < 10 ? 'ok' : (protDiff > 0 ? 'over' : 'under');

  const msg = Math.abs(kcalDiff) < 100 && Math.abs(protDiff) < 10 ? '✓ Nailed it — on target for the day.' :
    kcalDiff > 200 ? 'Slightly over on calories — easy to adjust tomorrow.' :
    kcalDiff < -200 ? 'Under on calories — make sure to fuel recovery.' :
    protDiff < -15 ? 'Protein a bit low — try a Greek yogurt before bed.' : 'Close to target — solid day.';

  const summEl = document.getElementById('meal-summary');
  if (summEl) summEl.innerHTML = `<div class="summary-card">
    <div class="summary-title">Day summary</div>
    <div class="summary-grid">
      <div class="summary-item"><div class="summary-num ${kcalClass}">${Math.round(totalKcal)}</div><div class="summary-lbl">actual kcal</div><div style="font-size:11px;color:var(--color-text-tertiary)">${kcalDiff>0?'+':''}${kcalDiff} vs plan</div></div>
      <div class="summary-item"><div class="summary-num" style="color:var(--color-text-tertiary)">${plan.kcal}</div><div class="summary-lbl">target kcal</div></div>
      <div class="summary-item"><div class="summary-num ${protClass}">${Math.round(totalProt)}g</div><div class="summary-lbl">actual protein</div><div style="font-size:11px;color:var(--color-text-tertiary)">${protDiff>0?'+':''}${protDiff}g vs plan</div></div>
      <div class="summary-item"><div class="summary-num" style="color:var(--color-text-tertiary)">${plan.protein}g</div><div class="summary-lbl">target protein</div></div>
    </div>
    <p style="font-size:12px;color:var(--teal);margin-top:10px;text-align:center">${msg}</p>
  </div>`;
}

function renderHistory() {
  const cont = document.getElementById('history-content');
  const keys = Object.keys(history).filter(k => !k.startsWith('meal_')).sort().reverse();
  if (!keys.length) {
    cont.innerHTML = '<div class="empty-state"><i class="ti ti-history"></i><p style="font-size:16px;font-weight:500;color:var(--color-text-primary)">No workouts yet</p><p style="font-size:13px;margin-top:8px">Log your first session in the Workout tab.</p></div>';
    return;
  }
  cont.innerHTML = keys.map(key => {
    const log = history[key];
    if (!log.exercises) return '';
    const d = new Date(key.split('_')[0]);
    const formatted = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
    const lines = Object.entries(log.exercises).map(([name, data]) => {
      if (data.amrap !== undefined && data.amrap) return `${name}: ${data.amrap} ${data.unit}`;
      if (data.summary) return `${name}: ${data.summary}`;
      return '';
    }).filter(Boolean).join('\n');
    return `<div class="history-card">
      <div class="history-date">${formatted}</div>
      <div class="history-day-label">${log.label || log.day}</div>
      <div class="history-exercises" style="white-space:pre-line">${lines || 'Session logged'}</div>
      ${log.note ? `<div style="font-size:12px;color:var(--color-text-secondary);margin-top:8px;padding-top:8px;border-top:0.5px solid var(--color-border-tertiary);font-style:italic">"${log.note}"</div>` : ''}
    </div>`;
  }).join('');
}

buildDaySelector('workout-day-selector', workoutDay, renderWorkout);
buildDaySelector('meal-day-selector', mealDay, renderMeals);
renderWorkout(workoutDay);
renderMeals(mealDay);
</script>
</body>
</html>
