<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FF Fitness">
<title>Fitness Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --color-background-primary:#ffffff;--color-background-secondary:#f5f5f4;
  --color-background-tertiary:#eeede8;--color-text-primary:#1a1a18;
  --color-text-secondary:#5f5e5a;--color-text-tertiary:#888780;
  --color-border-tertiary:rgba(0,0,0,0.12);--border-radius-md:8px;--border-radius-lg:12px;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --orange:#D85A30;--orange-light:#FAECE7;--orange-dark:#993C1D;
  --teal:#1D9E75;--teal-light:#E1F5EE;--teal-dark:#085041;
  --purple:#534AB7;--purple-light:#EEEDFE;--purple-dark:#3C3489;
  --green:#639922;--green-light:#EAF3DE;
}
@media(prefers-color-scheme:dark){
  :root{
    --color-background-primary:#1e1e1c;--color-background-secondary:#2a2a28;
    --color-background-tertiary:#131312;--color-text-primary:#f0efe8;
    --color-text-secondary:#b4b2a9;--color-text-tertiary:#888780;
    --color-border-tertiary:rgba(255,255,255,0.1);
    --orange-light:#3a1a0e;--orange-dark:#f0a080;
    --teal-light:#0a2a20;--purple-light:#1a1830;--green-light:#1a2e08;
  }
}
body{font-family:var(--font-sans);background:var(--color-background-tertiary);color:var(--color-text-primary);min-height:100vh}
.app{max-width:480px;margin:0 auto;background:var(--color-background-tertiary);min-height:100vh}
.tab-bar{display:flex;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);position:sticky;top:0;z-index:20}
.tab-btn{flex:1;padding:10px 4px 8px;font-size:11px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--color-text-secondary);border-bottom:2px solid transparent;transition:all .15s;font-family:var(--font-sans)}
.tab-btn i{display:block;font-size:21px;margin-bottom:2px}
.tab-btn.active{color:var(--orange);border-bottom-color:var(--orange)}
.screen{display:none;padding:16px 16px 100px}
.screen.active{display:block}
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-input{flex:1;height:38px;border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);padding:0 12px;font-size:14px;color:var(--color-text-primary);outline:none;font-family:var(--font-sans)}
.search-input:focus{border-color:var(--orange)}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:5px 12px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);font-size:12px;cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary);font-family:var(--font-sans);transition:all .15s}
.filter-chip.active{background:var(--orange);border-color:var(--orange);color:white}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex-item{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer}
.ex-icon{width:38px;height:38px;border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ex-icon.barbell{background:var(--orange-light);color:var(--orange)}
.ex-icon.calisthenics{background:var(--purple-light);color:var(--purple)}
.ex-icon.machine{background:var(--teal-light);color:var(--teal)}
.ex-icon.custom{background:var(--green-light);color:var(--green)}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:500;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-meta{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.ex-add-btn{width:32px;height:32px;border-radius:50%;border:0.5px solid var(--color-border-tertiary);background:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);flex-shrink:0}
.ex-add-btn.added{background:var(--green-light);border-color:var(--green);color:var(--green)}
.section-label{font-size:10px;font-weight:500;color:var(--color-text-tertiary);letter-spacing:.5px;text-transform:uppercase;margin:16px 0 8px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end}
.modal{background:var(--color-background-primary);border-radius:16px 16px 0 0;width:100%;padding:20px 16px 40px;max-height:88vh;overflow-y:auto;position:relative}
.modal-handle{width:36px;height:4px;background:var(--color-border-tertiary);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:17px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--color-text-secondary);margin-bottom:16px}
.modal-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border:none;background:var(--color-background-secondary);border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary)}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:20px}
.tag-barbell{background:var(--orange-light);color:var(--orange-dark)}
.tag-calisthenics{background:var(--purple-light);color:var(--purple-dark)}
.tag-machine{background:var(--teal-light);color:var(--teal-dark)}
.tag-custom{background:var(--green-light);color:var(--green)}
.tag-muscle{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.btn-primary{width:100%;padding:13px;background:var(--orange);color:white;border:none;border-radius:var(--border-radius-lg);font-size:15px;font-weight:500;cursor:pointer;font-family:var(--font-sans);display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px}
.btn-primary:active{opacity:.85}
.btn-teal{background:var(--teal)}
.btn-secondary{width:100%;padding:12px;background:none;color:var(--color-text-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);font-size:15px;cursor:pointer;font-family:var(--font-sans);margin-top:8px}
.form-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;margin-top:12px;display:block}
.form-input{width:100%;height:38px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);padding:0 12px;font-size:14px;color:var(--color-text-primary);outline:none;font-family:var(--font-sans)}
.form-input:focus{border-color:var(--orange)}
.form-select{width:100%;height:38px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);padding:0 10px;font-size:14px;color:var(--color-text-primary);outline:none;font-family:var(--font-sans);cursor:pointer}
.plan-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:8px}
.plan-card-header{padding:12px 14px;display:flex;align-items:center;gap:10px}
.plan-card-num{width:26px;height:26px;border-radius:50%;background:var(--orange-light);color:var(--orange);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.plan-card-name{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.plan-card-meta{font-size:11px;color:var(--color-text-secondary)}
.plan-remove{width:28px;height:28px;border:none;background:none;cursor:pointer;font-size:16px;color:var(--color-text-tertiary);display:flex;align-items:center;justify-content:center}
.plan-sets{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
.set-row{display:flex;gap:6px;align-items:center}
.set-lbl{font-size:12px;color:var(--color-text-tertiary);width:28px;text-align:center}
.set-inp{flex:1;height:34px;border-radius:8px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);text-align:center;font-size:13px;color:var(--color-text-primary);outline:none;font-family:var(--font-sans);-webkit-appearance:none}
.set-inp:focus{border-color:var(--orange)}
.set-x{font-size:12px;color:var(--color-text-tertiary)}
.set-done{width:30px;height:30px;border-radius:50%;border:0.5px solid var(--color-border-tertiary);background:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--color-text-tertiary);flex-shrink:0}
.set-done.ok{background:var(--green);border-color:var(--green);color:white}
.add-set-btn{margin:4px 14px 0;padding:7px;font-size:12px;color:var(--color-text-secondary);background:none;border:0.5px dashed var(--color-border-tertiary);border-radius:8px;cursor:pointer;width:calc(100% - 28px);font-family:var(--font-sans)}
.history-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;margin-bottom:8px}
.history-date{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:2px}
.history-wname{font-size:11px;color:var(--orange);font-weight:500;margin-bottom:6px}
.history-lines{font-size:12px;color:var(--color-text-secondary);line-height:1.9;white-space:pre-line}
.note-area{width:100%;height:64px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);padding:8px 10px;font-size:13px;color:var(--color-text-primary);font-family:var(--font-sans);outline:none;resize:none;margin-top:6px}
.counter-badge{position:absolute;top:-5px;right:-8px;min-width:16px;height:16px;background:var(--orange);color:white;border-radius:8px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:500;padding:0 3px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
</style>
</head>
<body>
<div class="app" id="root">
<div class="tab-bar">
  <button class="tab-btn active" onclick="nav('library')" id="tab-library"><i class="ti ti-books" aria-hidden="true"></i>Library</button>
  <button class="tab-btn" onclick="nav('workout')" id="tab-workout"><i class="ti ti-barbell" aria-hidden="true"></i><span style="position:relative;display:inline-block"><span id="plan-badge" style="display:none" class="counter-badge">0</span>Workout</span></button>
  <button class="tab-btn" onclick="nav('history')" id="tab-history"><i class="ti ti-history" aria-hidden="true"></i>History</button>
</div>
<div class="screen active" id="screen-library">
  <div class="search-bar">
    <input class="search-input" id="search" placeholder="Search exercises..." oninput="filterLib()" autocomplete="off">
    <button class="btn-primary" style="width:auto;padding:0 14px;margin:0;border-radius:var(--border-radius-lg);font-size:13px" onclick="openAddCustom()"><i class="ti ti-plus" aria-hidden="true"></i>Custom</button>
  </div>
  <div class="filter-row" id="cat-filters"></div>
  <div class="filter-row" id="muscle-filters"></div>
  <div class="ex-list" id="ex-list"></div>
</div>
<div class="screen" id="screen-workout">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
    <p style="font-size:17px;font-weight:500;color:var(--color-text-primary)">Today's workout</p>
    <button style="font-size:12px;color:var(--color-text-secondary);background:none;border:none;cursor:pointer" onclick="clearPlan()">Clear all</button>
  </div>
  <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:14px" id="plan-date"></p>
  <div id="plan-list"></div>
  <div id="plan-empty" style="text-align:center;padding:50px 20px;color:var(--color-text-tertiary);display:none">
    <i class="ti ti-playlist-add" style="font-size:44px;display:block;margin-bottom:10px" aria-hidden="true"></i>
    <p style="font-size:15px;font-weight:500;color:var(--color-text-primary)">No exercises yet</p>
    <p style="font-size:13px;margin-top:6px">Go to Library and tap + to add exercises</p>
  </div>
  <div id="plan-bottom" style="display:none">
    <div class="section-label">Session notes</div>
    <textarea class="note-area" id="session-note" placeholder="How did it feel? Any PRs?"></textarea>
    <button class="btn-primary btn-teal" onclick="saveSession()" style="margin-top:12px"><i class="ti ti-device-floppy" aria-hidden="true"></i>Save session</button>
  </div>
</div>
<div class="screen" id="screen-history">
  <div id="history-list"></div>
</div>
<div id="modal-root"></div>
</div>

  {id:'m8',name:'Face pull (cable)',cat:'machine',muscles:['Rear delts','Traps','External rotators'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m9',name:'Cable lateral raise',cat:'machine',muscles:['Side delts'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m10',name:'Leg press',cat:'machine',muscles:['Quads','Glutes','Hamstrings'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m11',name:'Leg extension',cat:'machine',muscles:['Quads'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m12',name:'Leg curl',cat:'machine',muscles:['Hamstrings'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m13',name:'Hip abduction machine',cat:'machine',muscles:['Glutes','Abductors'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m14',name:'Hip adduction machine',cat:'machine',muscles:['Adductors'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m15',name:'Seated calf raise',cat:'machine',muscles:['Calves'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m16',name:'Standing calf raise',cat:'machine',muscles:['Calves','Tibialis'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m17',name:'Chest press machine',cat:'machine',muscles:['Chest','Shoulders','Triceps'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m18',name:'Shoulder press machine',cat:'machine',muscles:['Shoulders','Triceps'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m19',name:'Pec deck',cat:'machine',muscles:['Chest'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m20',name:'Reverse pec deck',cat:'machine',muscles:['Rear delts','Rhomboids'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m21',name:'Smith machine squat',cat:'machine',muscles:['Quads','Glutes'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m22',name:'Smith machine bench',cat:'machine',muscles:['Chest','Shoulders'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m23',name:'Hack squat machine',cat:'machine',muscles:['Quads'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m24',name:'Preacher curl machine',cat:'machine',muscles:['Biceps'],type:'weighted',icon:'ti-adjustments-horizontal'},
  {id:'m25',name:'Back extension machine',cat:'machine',muscles:['Lower back','Glutes'],type:'weighted',icon:'ti-adjustments-horizontal'},
];
const CAT_META={
  barbell:{label:'Barbell & dumbbell',icon:'ti-barbell',cls:'barbell',tagcls:'tag-barbell'},
  calisthenics:{label:'Calisthenics',icon:'ti-man',cls:'calisthenics',tagcls:'tag-calisthenics'},
  machine:{label:'Machines & cables',icon:'ti-adjustments-horizontal',cls:'machine',tagcls:'tag-machine'},
  custom:{label:'Custom',icon:'ti-puzzle',cls:'custom',tagcls:'tag-custom'},
};
const TYPE_LABELS={weighted:'Weighted',reps:'Reps only',time:'Timed',amrap:'AMRAP'};
let customExercises=[],plan=[],history={},activeCat='all',activeMuscle='all',searchQ='';
try{customExercises=JSON.parse(localStorage.getItem('ff_custom')||'[]')}catch(e){}
try{history=JSON.parse(localStorage.getItem('ff_hist2')||'{}')}catch(e){}
function save(){try{localStorage.setItem('ff_custom',JSON.stringify(customExercises))}catch(e){}try{localStorage.setItem('ff_hist2',JSON.stringify(history))}catch(e){}}
function allEx(){return[...EXERCISES,...customExercises]}
function nav(s){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.getElementById('screen-'+s).classList.add('active');document.getElementById('tab-'+s).classList.add('active');if(s==='history')renderHistory();if(s==='workout')renderPlan();if(s==='library')renderLib()}
function buildCatFilters(){const c=document.getElementById('cat-filters');const cats=[{id:'all',label:'All'},...Object.entries(CAT_META).map(([id,m])=>({id,label:m.label}))];c.innerHTML=cats.map(ct=>`<button class="filter-chip${activeCat===ct.id?' active':''}" onclick="setCat('${ct.id}')">${ct.label}</button>`).join('')}
function buildMuscleFilters(){const c=document.getElementById('muscle-filters');const ms=new Set();allEx().forEach(e=>e.muscles.forEach(m=>ms.add(m)));const muscles=['all',...[...ms].sort()];c.innerHTML=muscles.slice(0,14).map(m=>`<button class="filter-chip${activeMuscle===m?' active':''}" onclick="setMuscle('${m}')">${m==='all'?'All muscles':m}</button>`).join('')}
function setCat(c){activeCat=c;renderLib()}
function setMuscle(m){activeMuscle=m;renderLib()}
function filterLib(){searchQ=document.getElementById('search').value.toLowerCase();renderLib()}
function renderLib(){buildCatFilters();buildMuscleFilters();const list=document.getElementById('ex-list');const inPlan=new Set(plan.map(p=>p.exId));let exs=allEx();if(activeCat!=='all')exs=exs.filter(e=>e.cat===activeCat);if(activeMuscle!=='all')exs=exs.filter(e=>e.muscles.includes(activeMuscle));if(searchQ)exs=exs.filter(e=>e.name.toLowerCase().includes(searchQ)||e.muscles.some(m=>m.toLowerCase().includes(searchQ)));if(!exs.length){list.innerHTML='<div style="text-align:center;padding:40px 0;color:var(--color-text-tertiary)"><i class="ti ti-search-off" style="font-size:36px;display:block;margin-bottom:8px"></i>No exercises found</div>';return}list.innerHTML=exs.map(ex=>{const m=CAT_META[ex.cat]||CAT_META.custom;const added=inPlan.has(ex.id);return`<div class="ex-item" onclick="openExDetail('${ex.id}')"><div class="ex-icon ${m.cls}"><i class="ti ${ex.icon||m.icon}" aria-hidden="true"></i></div><div class="ex-info"><div class="ex-name">${ex.name}</div><div class="ex-meta">${ex.muscles.slice(0,2).join(' · ')}${ex.muscles.length>2?' +'+(ex.muscles.length-2):''}  ·  ${TYPE_LABELS[ex.type]||ex.type}</div></div><button class="ex-add-btn${added?' added':''}" onclick="event.stopPropagation();togglePlan('${ex.id}')" aria-label="${added?'Remove':'Add'}"><i class="ti ${added?'ti-check':'ti-plus'}" aria-hidden="true"></i></button></div>`}).join('')}
function openExDetail(id){const ex=allEx().find(e=>e.id===id);if(!ex)return;const m=CAT_META[ex.cat]||CAT_META.custom;const inPlan=plan.some(p=>p.exId===id);showModal(`<div class="modal-handle"></div><button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div class="ex-icon ${m.cls}" style="width:46px;height:46px;border-radius:var(--border-radius-lg);font-size:22px"><i class="ti ${ex.icon||m.icon}"></i></div><div><p class="modal-title">${ex.name}</p><p style="font-size:12px;color:var(--color-text-secondary)">${m.label}</p></div></div><div class="tag-row">${ex.muscles.map(mu=>`<span class="tag tag-muscle">${mu}</span>`).join('')}<span class="tag ${m.tagcls}">${m.label}</span><span class="tag tag-muscle">${TYPE_LABELS[ex.type]||ex.type}</span></div>${ex.cat==='custom'?`<button class="btn-secondary" onclick="closeModal();deleteCustom('${id}')" style="color:#E24B4A;border-color:#E24B4A">Delete exercise</button>`:''}<button class="btn-primary" onclick="closeModal();togglePlan('${id}')"><i class="ti ${inPlan?'ti-minus':'ti-plus'}"></i>${inPlan?'Remove from workout':'Add to workout'}</button>`)}
function togglePlan(exId){const idx=plan.findIndex(p=>p.exId===exId);if(idx>-1){plan.splice(idx,1)}else{const ex=allEx().find(e=>e.id===exId);if(!ex)return;const n=ex.type==='time'?3:3;plan.push({exId,sets:Array(n).fill(null).map(()=>({v1:'',v2:'',done:false}))})}updateBadge();renderLib()}
function updateBadge(){const b=document.getElementById('plan-badge');if(plan.length>0){b.style.display='flex';b.textContent=plan.length}else b.style.display='none'}
function clearPlan(){if(!plan.length)return;if(confirm('Clear all exercises?')){plan=[];updateBadge();renderPlan()}}
function renderPlan(){const cont=document.getElementById('plan-list');const empty=document.getElementById('plan-empty');const bottom=document.getElementById('plan-bottom');document.getElementById('plan-date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});if(!plan.length){cont.innerHTML='';empty.style.display='block';bottom.style.display='none';return}empty.style.display='none';bottom.style.display='block';cont.innerHTML=plan.map((p,pi)=>{const ex=allEx().find(e=>e.id===p.exId);if(!ex)return'';const m=CAT_META[ex.cat]||CAT_META.custom;const isW=ex.type==='weighted',isT=ex.type==='time';const sets=p.sets.map((s,si)=>{if(isW)return`<div class="set-row"><span class="set-lbl">${si+1}</span><input class="set-inp" type="number" placeholder="kg" value="${s.v1}" oninput="setVal(${pi},${si},'v1',this.value)" style="max-width:58px" inputmode="decimal"><span class="set-x">kg×</span><input class="set-inp" type="number" placeholder="reps" value="${s.v2}" oninput="setVal(${pi},${si},'v2',this.value)" inputmode="numeric"><button class="set-done${s.done?' ok':''}" onclick="toggleDone(${pi},${si})"><i class="ti ti-check"></i></button></div>`;if(isT)return`<div class="set-row"><span class="set-lbl">${si+1}</span><input class="set-inp" type="text" placeholder="sec / notes" value="${s.v1}" oninput="setVal(${pi},${si},'v1',this.value)" style="text-align:left;padding-left:10px"><button class="set-done${s.done?' ok':''}" onclick="toggleDone(${pi},${si})"><i class="ti ti-check"></i></button></div>`;return`<div class="set-row"><span class="set-lbl">${si+1}</span><input class="set-inp" type="number" placeholder="reps" value="${s.v1}" oninput="setVal(${pi},${si},'v1',this.value)" inputmode="numeric"><button class="set-done${s.done?' ok':''}" onclick="toggleDone(${pi},${si})"><i class="ti ti-check"></i></button></div>`}).join('');return`<div class="plan-card"><div class="plan-card-header"><div class="plan-card-num">${pi+1}</div><div style="flex:1"><div class="plan-card-name">${ex.name}</div><div class="plan-card-meta">${m.label} · ${p.sets.length} sets</div></div><button class="plan-remove" onclick="removePlanEx(${pi})"><i class="ti ti-x"></i></button></div><div class="plan-sets">${sets}</div><button class="add-set-btn" onclick="addSet(${pi})"><i class="ti ti-plus"></i> Add set</button></div>`}).join('')}
function setVal(pi,si,k,v){plan[pi].sets[si][k]=v}
function toggleDone(pi,si){plan[pi].sets[si].done=!plan[pi].sets[si].done;renderPlan()}
function removePlanEx(pi){plan.splice(pi,1);updateBadge();renderPlan()}
function addSet(pi){plan[pi].sets.push({v1:'',v2:'',done:false});renderPlan()}
function saveSession(){const note=document.getElementById('session-note');const today=new Date().toISOString().split('T')[0];const key=today+'_'+Date.now();const exercises={};plan.forEach(p=>{const ex=allEx().find(e=>e.id===p.exId);if(!ex)return;const isW=ex.type==='weighted';const summary=p.sets.filter(s=>s.v1||s.v2).map(s=>isW?`${s.v1||'?'}kg×${s.v2||'?'}`:(s.v1||'?')).join(', ');exercises[ex.name]={sets:p.sets,summary,type:ex.type}});history[key]={exercises,note:note?note.value:'',workoutName:'Custom workout',date:today};save();const btn=document.querySelector('#plan-bottom .btn-primary');if(btn){btn.innerHTML='<i class="ti ti-check"></i> Saved!';btn.style.background='#3B6D11';setTimeout(()=>{btn.innerHTML='<i class="ti ti-device-floppy"></i> Save session';btn.style.background=''},1800)}}
function renderHistory(){const cont=document.getElementById('history-list');const keys=Object.keys(history).sort().reverse();if(!keys.length){cont.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--color-text-tertiary)"><i class="ti ti-history" style="font-size:44px;display:block;margin-bottom:10px"></i><p style="font-size:15px;font-weight:500;color:var(--color-text-primary)">No sessions yet</p><p style="font-size:13px;margin-top:6px">Build a workout and save it.</p></div>';return}cont.innerHTML=keys.map(k=>{const s=history[k];const d=new Date(s.date||k.split('_')[0]);const fmt=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});const lines=Object.entries(s.exercises).map(([n,d])=>d.summary?`${n}: ${d.summary}`:n).join('\n');return`<div class="history-card"><div class="history-date">${fmt}</div><div class="history-wname">${s.workoutName||'Workout'}</div><div class="history-lines">${lines||'Session logged'}</div>${s.note?`<div style="font-size:12px;color:var(--color-text-secondary);margin-top:8px;padding-top:8px;border-top:0.5px solid var(--color-border-tertiary);font-style:italic">"${s.note}"</div>`:''}</div>`}).join('')}
function openAddCustom(){showModal(`<div class="modal-handle"></div><button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button><p class="modal-title">Add custom exercise</p><p class="modal-sub">Saved permanently to your library</p><label class="form-label">Exercise name *</label><input class="form-input" id="c-name" placeholder="e.g. Nordic curl" autocomplete="off"><label class="form-label">Category</label><select class="form-select" id="c-cat"><option value="barbell">Barbell & dumbbell</option><option value="calisthenics">Calisthenics</option><option value="machine">Machines & cables</option></select><label class="form-label">Primary muscles (comma-separated)</label><input class="form-input" id="c-muscles" placeholder="e.g. Quads, Glutes"><label class="form-label">Tracking type</label><select class="form-select" id="c-type"><option value="weighted">Weighted (kg × reps)</option><option value="reps">Reps only</option><option value="time">Timed</option></select><button class="btn-primary" onclick="saveCustom()" style="margin-top:16px"><i class="ti ti-plus"></i>Add to library</button>`)}
function saveCustom(){const name=document.getElementById('c-name').value.trim();if(!name)return;const muscles=document.getElementById('c-muscles').value.split(',').map(m=>m.trim()).filter(Boolean);customExercises.push({id:'custom_'+Date.now(),name,cat:'custom',muscles:muscles.length?muscles:['Custom'],type:document.getElementById('c-type').value,icon:'ti-puzzle'});save();closeModal();renderLib()}
function deleteCustom(id){customExercises=customExercises.filter(e=>e.id!==id);plan=plan.filter(p=>p.exId!==id);save();updateBadge();renderLib()}
function showModal(html){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">${html}</div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
updateBadge();renderLib();document.getElementById('plan-date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});document.getElementById('plan-empty').style.display='block';
</script>
</body>
</html>
